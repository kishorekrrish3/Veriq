<svg width="840" height="200" viewBox="0 0 840 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Radial Ambient Glows -->
    <radialGradient id="ambient-cyan" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambient-purple" cx="80%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#BF5AF2" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Metallic Stroke -->
    <linearGradient id="specular-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#64D2FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Icon Gradient -->
    <linearGradient id="icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2433"/>
      <stop offset="100%" stop-color="#0C0F17"/>
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#64D2FF" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Banner Outer Container (Apple Liquid Glass) -->
  <rect width="840" height="200" rx="24" fill="#06080D"/>
  <rect width="840" height="200" rx="24" fill="url(#ambient-cyan)"/>
  <rect width="840" height="200" rx="24" fill="url(#ambient-purple)"/>
  <rect x="1" y="1" width="838" height="198" rx="23" stroke="url(#specular-border)" stroke-width="1.5"/>

  <!-- Logo Mark Squircle Shield -->
  <g transform="translate(40, 36)">
    <rect width="128" height="128" rx="28" fill="url(#icon-grad)" stroke="url(#specular-border)" stroke-width="1.5"/>
    <rect x="2" y="2" width="124" height="124" rx="26" stroke="#2A3347" stroke-width="1"/>
    
    <!-- Precision Checkmark / V Geometry -->
    <path d="M32 44L58 90L96 36" stroke="#64D2FF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <path d="M58 90L78 56" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="96" cy="36" r="7" fill="#64D2FF"/>
  </g>

  <!-- Typography Brand Identity -->
  <!-- Brand Wordmark -->
  <text x="194" y="92" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Montserrat', sans-serif" font-size="52" font-weight="800" letter-spacing="-0.03em" fill="#FFFFFF">VERIQ</text>

  <!-- Verified Badge -->
  <rect x="368" y="58" width="120" height="26" rx="13" fill="rgba(10, 132, 255, 0.16)" stroke="rgba(100, 210, 255, 0.35)" stroke-width="1"/>
  <text x="382" y="75" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="11" font-weight="700" fill="#64D2FF" letter-spacing="0.04em">DETERMINISTIC</text>

  <!-- Subtitle Tagline -->
  <text x="196" y="124" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="16" font-weight="600" fill="#E2E8F0" letter-spacing="-0.01em">Code is generated. Proof is earned.</text>

  <!-- Context Subtitle -->
  <text x="196" y="148" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="400" fill="#94A3B8">Evidence-Driven Autonomous Engineering Agent · Nebius × NVIDIA Global AI Hackathon</text>

  <!-- Hackathon Sponsor Capsule -->
  <g transform="translate(620, 42)">
    <rect width="180" height="34" rx="17" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1"/>
    <circle cx="20" cy="17" r="4" fill="#30D158"/>
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11.5" font-weight="600" fill="#FFFFFF">Nebius × NVIDIA</text>
  </g>
</svg>